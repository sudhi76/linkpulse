name: api

on:
  # No path filter on pull requests: these checks are required to merge into
  # main, and a required check that never starts would block the PR forever.
  pull_request:
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - "docker-compose.yml"
      - ".github/workflows/api.yml"

# Least privilege: the jobs only need to read the code.
permissions:
  contents: read

# A new push to the same PR cancels the run that is now out of date.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: services/api

# Actions are pinned to commit SHAs (tag in the comment): a tag can be moved
# to different code, a SHA cannot.
jobs:
  lint-test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13" # same as the runtime image
          cache: pip
          cache-dependency-path: services/api/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check --output-format=github .

      - name: Check formatting
        run: ruff format --check .

      - name: Test
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  image:
    # Keep this name: it is a required status check on main.
    name: Build image and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # push to ghcr.io (main only)
      security-events: write # upload Trivy results to the Security tab
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/linkpulse-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Builds the image into the local Docker engine (no push yet), reusing
      # layers from earlier runs.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/api
          push: false
          load: true
          # The name Compose gives the api image, so the next step reuses it.
          tags: linkpulse-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      # Fails the job on HIGH or CRITICAL vulnerabilities that have a fix
      # available. Unfixed ones are reported but can't be acted on yet.
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: linkpulse-api:latest
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Same scan as SARIF, so findings show up in the repository's Security tab.
      - name: Scan image (SARIF)
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: linkpulse-api:latest
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif
          skip-setup-trivy: true

      - name: Upload scan results
        if: ${{ !cancelled() && hashFiles('trivy.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy.sarif
          category: trivy-api

      # Starts the real stack (API + Postgres) and exercises it over HTTP, so
      # a broken image, config or database connection fails the PR.
      - name: Start stack
        working-directory: .
        run: docker compose up --no-build --wait --wait-timeout 120

      - name: Smoke test
        working-directory: .
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8000/readyz
          code=$(curl -fsS -X POST http://localhost:8000/links \
            -H 'Content-Type: application/json' \
            -d '{"url": "https://example.com/ci"}' | jq -r .code)
          location=$(curl -sS -o /dev/null -w '%{redirect_url}' "http://localhost:8000/$code")
          test "$location" = "https://example.com/ci"
          echo "redirect OK: /$code -> $location"

      - name: Show logs on failure
        if: failure()
        working-directory: .
        run: docker compose logs

      - name: Stop stack
        if: always()
        working-directory: .
        run: docker compose down -v

      # Only main publishes images, and only after the scan and smoke test have
      # passed. Tagged with the commit SHA and never overwritten: a deploy
      # refers to exactly one build. Rebuilt from the layer cache, so the
      # layers are the ones scanned above.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/api
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # SBOM and build provenance are attached to the image as attestations.
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=api

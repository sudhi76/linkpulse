apiVersion: v1
kind: Service
metadata:
  name: {{ include "linkpulse.api.name" . }}
  labels:
    {{- include "linkpulse.api.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "linkpulse.api.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http

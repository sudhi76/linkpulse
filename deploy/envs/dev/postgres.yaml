# PostgreSQL for the local kind cluster only. Production uses Amazon RDS,
# so this is deliberately minimal: one instance, no backups, no failover.
#
# The password is not in this file. Create it before applying:
#   kubectl -n linkpulse create secret generic postgres-credentials \
#     --from-literal=POSTGRES_PASSWORD=<password>
---
# Headless (clusterIP: None): DNS for "postgres" resolves straight to the
# pod's IP. A StatefulSet needs a headless Service for its stable pod DNS
# names (postgres-0.postgres), and the app still connects to postgres:5432.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: linkpulse
            - name: POSTGRES_USER
              value: linkpulse
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            # Use a subdirectory of the volume: block volumes such as EBS
            # contain lost+found at their root, and initdb refuses to run
            # in a directory that isn't empty.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U linkpulse -d linkpulse"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U linkpulse -d linkpulse"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
  # One PVC per pod, named data-postgres-<ordinal>. It outlives the pod and
  # the StatefulSet, so restarts and reinstalls keep the data. Delete the
  # PVC by hand to start from an empty database.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
